spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/student_fitness_info_db?rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD}
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 5
          max-wait: 2000ms
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
thread-pool:
  business:
    thread-pool-name: "businessExecutor"
    thread-name-prefix: "business-"
    core-pool-size: 8
    max-pool-size: 10
    queue-capacity: 200
  compute:
    thread-pool-name: "computeExecutor"
    thread-name-prefix: "compute-"
    queue-capacity: 50
    cpu-factor: 0.5
    extra-cores: 4
    await-termination-seconds: 120
  system:
    thread-pool-name: "systemExecutor"
    thread-name-prefix: "system-"
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 500
auth:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    min-length: 32
    expire: 900
    refresh-expire: 604800
    issuer: "student-fitness"
    audience: "web-client"
  security:
    permit-all-patterns:
      - /auth/login
      - /auth/refresh
    bcrypt-strength: 10
  session:
    session-expire: 604800
    max-online-sessions: 3
    blacklist-expire: 900
  risk:
    max-fail-count: 3
    lock-duration-seconds: 900
    count-window-seconds: 900
# ================================================================
#  Data Exchange 模块配置
# ================================================================
data-exchange:
  # ---------- 应用层配置（业务策略） ----------
  application:
    file:
      max-size: 200MB                      # 单文件最大大小
      allowed-extensions:                  # 支持的文件扩展名
        - .xlsx
        - .xls
    batch:
      default-size: 500                    # 默认每批处理条数
      stream-threshold: 10000              # 小文件阈值（< 此值走全量，≥ 此值走流式）
    validation:
      username-max-length: 50              # 用户名最大长度
      password-min-length: 6               # 密码最小长度
      nickname-max-length: 20              # 昵称最大长度
    display:
      error-msg-max-count: 5              # 错误摘要保留条数（前端展示）

  # ---------- 基础设施层配置（技术参数） ----------
  infrastructure:
    redis:
      task-ttl-hours: 24                   # 导入任务进度 TTL（小时）
      lock-ttl-minutes: 60                 # 文件锁 TTL（分钟）
      error-msg-max-length: 500            # 错误信息最大长度（存入 Redis 时截断）
      error-msg-max-count: 5               # 错误摘要保留条数
    rate-limit:
      window-seconds: 60                   # 限流时间窗口（秒）
      max-count: 5                         # 窗口内最大提交次数
    temp-file:
      root-dir: import                     # 临时文件根目录（相对于 java.io.tmpdir）
      file-name: data.xlsx                 # 临时文件名
